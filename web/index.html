<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"><title>AGP 评审与回复 · ICLR 2027</title><link rel="stylesheet" href="./style.css"><script type="module" src="./entry.js"></script></head><body>
<header data-anchor="site-header" data-title="AGP 评审与回复"><a class="brand" href="#/W5Bs"><span class="brand-mark">A</span><span>AGP Rebuttal<small>ICLR 2027</small></span></a><nav><span id="account"></span><button id="logout" hidden>退出登录</button><button id="export">导出回复</button><button id="resume-draft" hidden>继续批注草稿</button><button id="panel-toggle" aria-expanded="false">批注 <span id="comment-count">0</span></button></nav></header>
<div id="reviewer-tabs" role="tablist" aria-label="Reviewers" data-anchor="reviewer-tabs" data-title="Reviewer 标签页"></div>
<div class="workspace"><main id="main" tabindex="-1"><p>正在读取评审与回复…</p></main><div id="splitter" role="separator" aria-label="调整批注栏宽度" aria-orientation="vertical" tabindex="0" hidden></div><aside id="annotations" aria-label="批注栏" hidden><div class="panel-head"><div><small>修改意见与补充</small><h2>批注 <span id="panel-count">0</span></h2></div><button id="panel-close" aria-label="收起批注">×</button></div><div class="panel-scroll"><p class="panel-help">选中评审原文、译文或解读中的文字添加批注。回到对话说“处理网页批注”，即可继续处理。</p><div id="comment-list"></div></div></aside></div>
<section id="comment-composer" role="dialog" aria-labelledby="composer-title" hidden><div class="composer-head"><strong id="composer-title">添加批注</strong><button id="composer-close" aria-label="关闭并保留草稿">×</button></div><form id="comment-form"><div id="quote-preview" hidden><blockquote id="quote-text"></blockquote><button type="button" id="cancel-quote">取消引用</button></div><label for="comment-text">问题或修改意见</label><textarea id="comment-text" placeholder="写下你的问题或修改意见…" rows="4"></textarea><div class="form-footer"><small>Enter 保存 · Shift + Enter 换行</small><button type="submit" id="comment-save" class="primary">保存批注</button></div></form><p id="comment-error" role="alert"></p></section>
<button id="selection-add" hidden>添加批注</button><div id="toast" role="status" hidden></div></body></html>
